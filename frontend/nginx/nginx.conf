# HTTP - redirect everything to HTTPS
server {
    listen 80;
    server_name taiwofaladeprojects.xyz www.taiwofaladeprojects.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name taiwofaladeprojects.xyz www.taiwofaladeprojects.xyz;

    # SSL (Let's Encrypt auto cert renewal)
    ssl_certificate /etc/letsencrypt/live/taiwofaladeprojects.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taiwofaladeprojects.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ========== Proxy API gateway ==========
    location /api/ {
        proxy_pass http://192.168.1.72:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========== Proxy Consul UI ==========
    location /consul/ {
        proxy_pass http://192.168.1.72:8500/ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ========== Proxy Weave Scope ==========
    location /scope/ {
        proxy_pass http://192.168.1.72:4040/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ========== Proxy RabbitMQ UI ==========
    location /rabbitmq/ {
        proxy_pass http://192.168.1.72:15672/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ========== Proxy Kibana ==========
    location /kibana/ {
        proxy_pass http://kibana:5601/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========== Static Angular Frontend ==========
    root /usr/share/nginx/html;
    index index.html;

    # Try static, then fallback to Angular (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}