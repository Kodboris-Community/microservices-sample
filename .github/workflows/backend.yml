# .github/workflows/backend.yml
name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - taiwo-kibana
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend.yml'  # Adjusted filename if it’s not backend-deploy.yml

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  deploy:
    name: Deploy Backend to EC2
    runs-on: [self-hosted, linux, backend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject backend .env file
        working-directory: backend
        run: echo "${{ secrets.BACKEND_ENV_FILE }}" > .env

      - name: Deploy backend with Docker Compose
        working-directory: backend
        run: |
          echo "Deploying backend..."
          docker compose up -d --build --force-recreate
