# .github/workflows/backend.yml
name: Backend CI/CD Pipeline

on:
  push:
    paths:
      - 'backend/**'
    branches:
      - taiwo-kibana
  pull_request:
    paths:
      - 'backend/**'
    branches:
      - taiwo-kibana

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  deploy-backend:
    name: Deploy Backend to EC2 (Self-hosted)
    runs-on: [self-hosted, linux, backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full clone in case needed

      - name: Inject .env file
        working-directory: backend
        run: echo "${{ secrets.BACKEND_ENV_FILE }}" > .env

      - name: Build and deploy backend services
        working-directory: backend
        run: docker compose up -d --build --force-recreate


